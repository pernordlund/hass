  - platform: nordpool
    region: SE3
    currency: SEK
  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'
  - platform: integration
    source: sensor.bv_approx_power
    name: heat_pump_energy
    method: left
    unit_prefix: k
    round: 2
  - platform: google_wifi
    host: 192.168.86.1
  - platform: sjofartsverket_viva
    name: Vind Sandhamn
    region: 80
    scan_interval: 120
  - platform: sjofartsverket_viva
    name: Vind Söderarm
    region: 166
    scan_interval: 120
  - platform: sjofartsverket_viva
    name: Vind Landsort
    region: 2
    scan_interval: 120
  - platform: history_stats
    name: Hours worked today
    entity_id: sensor.pelle_work_status
    state:
      - 'At OKQ8'
      - 'At Home'
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"