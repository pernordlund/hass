  purge_keep_days: 3
  db_url: !secret rc_db_url
  include:
    domains:
      - switch
      - light
      - binary_sensor
      - device_tracker
      - input_number
      - input_boolean
      - lock
      - fan
      - media_player
    entity_globs:
      - sensor.*battery*
      - sensor.*temperature*
      - sensor.*humidity*
      - sensor.*pressure*
      - sensor.hp_*
      - sensor.netatmo_*
      - sensor.id_lock_*
      - sensor.speedtest_*
      - sensor.*savsangarvagen*
      - sensor.*luminance*
      - sensor.*light*
      - sensor.*energy*
      - sensor.*kwh*
      - sensor.*power*
      - sensor.*zigge*
      - sensor.*room_presence*
      - sensor.*distance*
      - sensor.vind*
      - sensor.ehqyy3ll*
    entities:
      - sensor.disk_free_home
      - sensor.daylight
      - sensor.range_extender_7_node_status
      - sensor.wind_bearing
      - sensor.pelle_work_status
      - sensor.hours_worked_today
      - sensor.stats_work_hours
      - sensor.google_wifi_local_ip
      - sensor.alta_kolarangen_2
      - sensor.ti_current_cost
